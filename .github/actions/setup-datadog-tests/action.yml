name: Setup Datadog Test Optimization
description: Install a pinned CI-only tracer for the owned Node Vitest launcher.
inputs:
  api-key:
    description: Datadog API key (not available to external pull requests).
    required: false
  site:
    description: Datadog intake site for this key, such as datadoghq.com.
    required: false
  tia:
    description: Allow backend TIA selection for all supported Vitest tests.
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Datadog test instrumentation
      shell: bash
      env:
        DD_API_KEY: ${{ inputs.api-key }}
        DD_SITE: ${{ inputs.site }}
        TIA: ${{ inputs.tia }}
      run: |
        set -euo pipefail
        if [[ -z "$DD_API_KEY" ]]; then
          echo "Datadog key unavailable; running the original uninstrumented tests."
          exit 0
        fi
        if [[ -z "$DD_SITE" ]]; then
          echo "Set the DD_SITE repository variable to the site matching DD_API_KEY." >&2
          exit 1
        fi
        if [[ "$TIA" != true && "$TIA" != false ]]; then
          echo "Datadog TIA switch must be true or false." >&2
          exit 1
        fi
        tracer_prefix="$RUNNER_TEMP/openclaw-datadog"
        npm install --prefix "$tracer_prefix" --ignore-scripts --no-save --no-audit --no-fund dd-trace@6.18.0
        {
          echo "OPENCLAW_DD_TRACE_HOME=$tracer_prefix/node_modules/dd-trace"
          echo "DD_API_KEY=$DD_API_KEY"
          echo "DD_SITE=$DD_SITE"
          echo "DD_ENV=ci"
          echo "DD_SERVICE=openclaw-tests"
          echo "DD_CIVISIBILITY_ITR_ENABLED=$TIA"
          # The OpenAI span aggregator mutates streamed SDK chunks in dd-trace 6.18.0.
          echo "DD_TRACE_OPENAI_ENABLED=false"
          # HTTP propagation in dd-trace 6.18.0 loses Node's raw header-array fields.
          echo "DD_TRACE_HTTP_ENABLED=false"
          # Keep the application's OpenTelemetry provider and OTLP exporters native.
          echo "DD_TRACE_OTEL_ENABLED=false"
          echo "DD_CIVISIBILITY_AGENTLESS_ENABLED=true"
          echo "DD_CIVISIBILITY_EARLY_FLAKE_DETECTION_ENABLED=false"
          echo "DD_CIVISIBILITY_FLAKY_RETRY_ENABLED=false"
        } >> "$GITHUB_ENV"
