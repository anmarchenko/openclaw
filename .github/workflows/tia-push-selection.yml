      - name: Upload bounded public commit and tree closure once
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/repair-git-metadata.py" <<'REPAIR_SCRIPT'
          #!/usr/bin/env python3
          """Prepare or explicitly upload the fixed public OpenClaw commit/tree repair.

          No OpenClaw imports, test execution, Git fetch, blobs, guessed known-commit
          responses, redirects, or automatic HTTP retries. --upload is an explicit write.
          """

          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.error
          import urllib.request

          HEAD = "e27b3b76ba271b1a1d88a053f95fd6d6537f4e7c"
          PARENT = "744f3fd082e06329523f61e6c165c824f16b128b"
          REPOSITORY_URL = "https://github.com/anmarchenko/openclaw.git"
          ENDPOINT = "https://api.datadoghq.com/api/v2/git/repository/packfile"
          MAX_OBJECTS = 3000
          MAX_PACK_BYTES = 3 * 1024 * 1024
          OID = re.compile(r"^[0-9a-f]{40}$")


          class RepairError(Exception):
              def __init__(self, code, stage="prepare"):
                  super().__init__(code)
                  # Call sites supply fixed codes/stages, never subprocess or HTTP text.
                  self.code = code
                  self.stage = stage


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def git(repository, *args, data=None, stage="git"):
              env = os.environ.copy()
              # Never fetch lazy objects or honor replacement objects from another task.
              env["GIT_NO_LAZY_FETCH"] = "1"
              env["GIT_CONFIG_GLOBAL"] = os.devnull
              env["GIT_CONFIG_NOSYSTEM"] = "1"
              for name in ("GIT_DIR", "GIT_WORK_TREE", "GIT_INDEX_FILE", "GIT_OBJECT_DIRECTORY", "GIT_ALTERNATE_OBJECT_DIRECTORIES"):
                  env.pop(name, None)
              try:
                  result = subprocess.run(
                      ["git", "--no-replace-objects", "-c", "maintenance.auto=false", "-C", str(repository), *args],
                      input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env,
                      timeout=120, check=False,
                  )
              except subprocess.TimeoutExpired:
                  raise RepairError("git_timeout", stage) from None
              except OSError:
                  raise RepairError("git_start_failed", stage) from None
              if result.returncode:
                  # Git errors can include environment-dependent details; do not echo them.
                  raise RepairError("git_operation_failed", stage)
              return result.stdout


          def object_inventory(repository):
              # Shallow boundaries suppress revision traversal even when both objects exist.
              # Read the immutable commit header instead and require its exact single parent.
              commit_header = git(repository, "cat-file", "commit", HEAD, stage="validate_parent").split(b"\n\n", 1)[0]
              parents = [line[7:] for line in commit_header.split(b"\n") if line.startswith(b"parent ")]
              if parents != [PARENT.encode("ascii")]:
                  raise RepairError("unexpected_parent", "validate_parent")
              objects = {HEAD, PARENT}
              trees_by_commit = {}
              for commit in (HEAD, PARENT):
                  root = git(repository, "rev-parse", commit + "^{tree}", stage="read_root").decode().strip()
                  if not OID.fullmatch(root):
                      raise RepairError("invalid_root")
                  trees = {root}
                  for record in git(repository, "ls-tree", "-r", "-t", "-z", commit, stage="enumerate_trees").split(b"\0"):
                      if not record:
                          continue
                      metadata, _path = record.split(b"\t", 1)
                      _mode, kind, raw_oid = metadata.decode("ascii").split()
                      if kind == "tree":
                          if not OID.fullmatch(raw_oid):
                              raise RepairError("invalid_tree")
                          trees.add(raw_oid)
                      elif kind not in ("blob", "commit"):
                          raise RepairError("unexpected_tree_entry")
                      # Blob contents and submodule commit objects are deliberately omitted.
                  trees_by_commit[commit] = sorted(trees)
                  objects.update(trees)
              if not 2 < len(objects) <= MAX_OBJECTS:
                  raise RepairError("object_count_out_of_bounds")
              encoded = ("\n".join(sorted(objects)) + "\n").encode("ascii")
              checked = git(repository, "cat-file", "--batch-check=%(objectname) %(objecttype) %(objectsize)", data=encoded, stage="check_objects")
              types = {}
              for line in checked.decode("ascii").splitlines():
                  oid, kind, size = line.split()
                  if oid not in objects or kind not in ("tree", "commit") or not size.isdecimal():
                      raise RepairError("unexpected_object_type")
                  if (kind == "commit") != (oid in (HEAD, PARENT)):
                      raise RepairError("unexpected_commit")
                  types[oid] = kind
              if set(types) != objects:
                  raise RepairError("incomplete_inventory")
              return encoded, types, trees_by_commit


          def prepare(repository, output):
              encoded, types, trees = object_inventory(repository)
              pack = git(repository, "pack-objects", "--stdout", "--compression=9", "--no-reuse-delta", "--no-reuse-object", data=encoded, stage="pack_objects")
              if not 0 < len(pack) <= MAX_PACK_BYTES:
                  raise RepairError("pack_size_out_of_bounds")
              pack_path = output / "metadata.pack"
              idx_path = output / "metadata.idx"
              pack_path.write_bytes(pack)
              git(repository, "index-pack", "-o", str(idx_path), str(pack_path), stage="index_pack")
              verified = git(repository, "verify-pack", "-v", str(idx_path), stage="verify_pack").decode("ascii")
              verified_types = {}
              for line in verified.splitlines():
                  fields = line.split()
                  if fields and OID.fullmatch(fields[0]):
                      verified_types[fields[0]] = fields[1]
              if verified_types != types:
                  raise RepairError("pack_inventory_mismatch")
              # Recheck manifests and complete recursive closures immediately before any write.
              if object_inventory(repository) != (encoded, types, trees):
                  raise RepairError("inventory_changed")
              summary = {
                  "object_count": len(types),
                  "commit_count": sum(kind == "commit" for kind in types.values()),
                  "tree_count": sum(kind == "tree" for kind in types.values()),
                  "blob_count": 0,
                  "pack_bytes": len(pack),
                  "pack_sha256": hashlib.sha256(pack).hexdigest(),
              }
              (output / "objects.txt").write_bytes(encoded)
              (output / "inventory.json").write_text(json.dumps({**summary, "head": HEAD, "parent": PARENT, "repository_url": REPOSITORY_URL, "tree_closures": trees}, indent=2) + "\n")
              return pack, summary


          def upload(pack, summary):
              api_key = os.environ.get("DD_API_KEY")
              if not api_key:
                  raise RepairError("missing_api_key", "upload_configuration")
              boundary = "openclaw-metadata-" + summary["pack_sha256"]
              identity = json.dumps({"data": {"id": HEAD, "type": "commit"}, "meta": {"repository_url": REPOSITORY_URL}}, separators=(",", ":")).encode("ascii")
              body = (
                  ("--" + boundary + '\r\nContent-Disposition: form-data; name="pushedSha"\r\nContent-Type: application/json\r\n\r\n').encode("ascii")
                  + identity
                  + ("\r\n--" + boundary + '\r\nContent-Disposition: form-data; name="packfile"; filename="' + summary["pack_sha256"] + '.pack"\r\nContent-Type: application/octet-stream\r\n\r\n').encode("ascii")
                  + pack + ("\r\n--" + boundary + "--\r\n").encode("ascii")
              )
              request = urllib.request.Request(ENDPOINT, data=body, method="POST", headers={
                  "DD-API-KEY": api_key,
                  "Content-Type": "multipart/form-data; boundary=" + boundary,
                  "User-Agent": "openclaw-git-metadata-repair/1",
              })
              # Exactly one request. Never follow redirects carrying the API key.
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(request, timeout=15) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
              except (urllib.error.URLError, TimeoutError, OSError):
                  print(json.dumps({**summary, "status": "upload_outcome_unknown"}), flush=True)
                  return 2
              print(json.dumps({**summary, "status": status}), flush=True)
              return 0 if status == 204 else 1


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repository", type=Path, required=True)
              parser.add_argument("--output-parent", type=Path, default=Path(tempfile.gettempdir()))
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--prepare-only", action="store_true")
              mode.add_argument("--upload", action="store_true")
              args = parser.parse_args()
              try:
                  args.output_parent.mkdir(parents=True, exist_ok=True)
                  output = Path(tempfile.mkdtemp(prefix="openclaw-git-metadata-", dir=args.output_parent)).resolve()
                  pack, summary = prepare(args.repository.resolve(), output)
                  if args.prepare_only:
                      print(json.dumps({**summary, "status": "prepared_no_upload"}), flush=True)
                      return 0
                  return upload(pack, summary)
              except RepairError as error:
                  print(json.dumps({"status": "preparation_or_configuration_failed", "stage": error.stage, "code": error.code}), flush=True)
                  return 1
              except (ValueError, OSError):
                  # No credential, environment, Git stderr, HTTP body, or traceback output.
                  print(json.dumps({"status": "preparation_or_configuration_failed", "stage": "prepare_or_upload_configuration", "code": "invalid_input_or_io_failure"}), flush=True)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          REPAIR_SCRIPT
          python3 -I -S "$RUNNER_TEMP/repair-git-metadata.py" --repository "$GITHUB_WORKSPACE" --output-parent "$RUNNER_TEMP" --upload
