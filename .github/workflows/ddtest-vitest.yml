name: ddtest Vitest

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      config:
        type: string
        required: true
      max-runners:
        type: number
        required: true
      build:
        type: string
        default: ""
      go:
        type: boolean
        default: false
      ripgrep:
        type: boolean
        default: false
      git-commits-json:
        type: string
        default: "[]"
      selection-gzip-base64:
        type: string
        default: ""
      groups-gzip-base64:
        type: string
        default: ""
      env-json:
        type: string
        default: "{}"
      sandbox:
        type: boolean
        default: false
      node-version:
        type: string
        default: "24.x"
      runtime-policy:
        type: string
        default: node
      requires-bun:
        type: boolean
        default: false
      plan-concurrency:
        type: string
        default: ""
      checkout-revision:
        type: string
        default: ""
      compatibility-target:
        type: boolean
        default: false
      cache-mode:
        type: string
        default: restore
      runner-json:
        type: string
        default: '"ubuntu-24.04"'
      browser:
        type: boolean
        default: false
      args:
        type: string
        default: ""
      skip-real-gateway:
        type: boolean
        default: false
      fallback-max-workers:
        type: number
        default: 0
      min-total-memory-bytes:
        type: number
        default: 0
      max-workers:
        type: number
        default: 2
      timeout-minutes:
        type: number
        default: 60
    secrets:
      DD_API_KEY:
        required: true

permissions:
  contents: read

env:
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: javascript
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: vitest
  DD_TEST_OPTIMIZATION_RUNNER_COMMAND: node --no-maglev --no-concurrent-sparkplug ./node_modules/vitest/vitest.mjs run --config ${{ inputs.config }} --configLoader runner ${{ inputs.compatibility-target && '--hookTimeout=600000' || '' }} ${{ inputs.args }}
  DD_SERVICE: openclaw-tests
  DD_ENV: ci
  DD_CIVISIBILITY_ITR_ENABLED: ${{ vars.DD_CIVISIBILITY_ITR_ENABLED || 'true' }}
  DD_CIVISIBILITY_EARLY_FLAKE_DETECTION_ENABLED: "false"
  DD_CIVISIBILITY_FLAKY_RETRY_ENABLED: "false"
  DD_TRACE_OPENAI_ENABLED: "false"
  DD_TRACE_HTTP_ENABLED: "false"
  DD_TRACE_OTEL_ENABLED: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_MAX_WORKERS: ${{ inputs.max-workers }}
  OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
  OPENCLAW_VITEST_RUNTIME: node
  OPENCLAW_CI_TEST_RUNTIME_POLICY: node
  OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: ${{ inputs.skip-real-gateway && '1' || '' }}
  RAYON_NUM_THREADS: "2"
  TOKIO_WORKER_THREADS: "2"

jobs:
  plan:
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - &runson
        name: Initialize RunsOn
        if: contains(inputs.runner-json, 'runs-on=') && runner.environment == 'self-hosted'
        uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2
      - &harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          sparse-checkout: |
            .github/actions
            scripts/lib
          persist-credentials: false
      - &selection
        name: Restore manifest selection and environment
        env:
          SELECTION_GZIP_BASE64: ${{ inputs.selection-gzip-base64 }}
          GROUP_ENV_JSON: ${{ inputs.env-json }}
          GROUPS_GZIP_BASE64: ${{ inputs.groups-gzip-base64 }}
          CONFIGURED_WORKERS: ${{ inputs.max-workers }}
          PLAN_CONCURRENCY: ${{ inputs.plan-concurrency }}
          FALLBACK_WORKERS: ${{ inputs.fallback-max-workers }}
          MIN_MEMORY_BYTES: ${{ inputs.min-total-memory-bytes }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { availableParallelism, totalmem } from "node:os";
          import { gunzipSync } from "node:zlib";
          const writeEnv = (name, value) => {
            if (!/^[A-Z_][A-Z_0-9]*$/.test(name) || typeof value !== "string" || /[\r\n]/.test(value)) {
              throw new Error("Invalid manifest test environment");
            }
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          };
          const cores = availableParallelism();
          const workers = Number(process.env.CONFIGURED_WORKERS) || (process.env.PLAN_CONCURRENCY !== "1" ? 2 : cores >= 12 ? 6 : cores >= 6 ? 4 : 3);
          let admittedWorkers = Math.min(workers, cores);
          const decode = (encoded) => JSON.parse(gunzipSync(Buffer.from(encoded, "base64")).toString("utf8"));
          const group = process.env.GROUPS_GZIP_BASE64 ? decode(process.env.GROUPS_GZIP_BASE64)[0] : undefined;
          const groupEnv = { ...JSON.parse(process.env.GROUP_ENV_JSON), ...group?.env };
          const fallback = Number(process.env.FALLBACK_WORKERS);
          if (fallback && (process.env.RUNNER_ENVIRONMENT !== "self-hosted" || totalmem() < Number(process.env.MIN_MEMORY_BYTES))) admittedWorkers = Math.min(admittedWorkers, fallback);
          if (groupEnv.OPENCLAW_VITEST_MAX_WORKERS) admittedWorkers = Math.min(admittedWorkers, Number(groupEnv.OPENCLAW_VITEST_MAX_WORKERS));
          if (!Number.isInteger(admittedWorkers) || admittedWorkers < 1) throw new Error("Invalid manifest worker limit");
          writeEnv("OPENCLAW_VITEST_MAX_WORKERS", String(admittedWorkers));
          for (const [name, value] of Object.entries(groupEnv)) {
            if (name !== "OPENCLAW_VITEST_MAX_WORKERS") writeEnv(name, value);
          }
          const extraArgs = JSON.parse(groupEnv.OPENCLAW_NODE_TEST_VITEST_ARGS_JSON ?? "[]");
          if (!Array.isArray(extraArgs) || extraArgs.some((arg) => typeof arg !== "string")) throw new Error("Invalid manifest Vitest arguments");
          if (extraArgs.length) {
            const quote = (arg) => "'" + arg.replaceAll("'", "'\"'\"'") + "'";
            writeEnv("DD_TEST_OPTIMIZATION_RUNNER_COMMAND", process.env.DD_TEST_OPTIMIZATION_RUNNER_COMMAND + " " + extraArgs.map(quote).join(" "));
          }
          const selected = process.env.SELECTION_GZIP_BASE64 ? decode(process.env.SELECTION_GZIP_BASE64) : group?.includePatterns;
          if (selected) {
            if (!Array.isArray(selected) || !selected.length || selected.some((file) => typeof file !== "string" || !file.length)) throw new Error("Invalid manifest test selection");
            const file = join(process.env.RUNNER_TEMP, "ddtest-selected-files.json");
            writeFileSync(file, JSON.stringify(selected));
            writeEnv("OPENCLAW_VITEST_INCLUDE_FILE", file);
          }
          NODE
      - &node
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: ${{ inputs.cache-mode }}
          node-version: ${{ inputs.node-version }}
          install-bun: "false"
          dependency-cache: "false"
          vitest-fs-cache: "true"
          vitest-worker-cache: ${{ inputs.build == '' && 'true' || 'false' }}
          node-compile-cache: "true"
      - &compat
        name: Apply frozen Node test compatibility
        if: inputs.checkout-revision == 'f773aa06a1a93b36b050f1a3f4b57d3d91311541'
        uses: ./.ci-harness/.github/actions/frozen-node-test-compat
        with:
          target-sha: ${{ inputs.checkout-revision }}
      - &bun
        if: inputs.requires-bun
        uses: ./.ci-harness/.github/actions/setup-test-bun
      - &git
        name: Fetch required Git fixtures
        env:
          FIXTURE_COMMITS_JSON: ${{ inputs.git-commits-json }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          for (const commit of JSON.parse(process.env.FIXTURE_COMMITS_JSON)) {
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("Invalid Git fixture SHA");
            const result = spawnSync("git", ["-c", "credential.helper=", "fetch", "--no-tags", "--depth=1", `https://github.com/${process.env.GITHUB_REPOSITORY}.git`, commit], { stdio: "inherit" });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
      - &go
        if: inputs.go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: false
      - &ripgrep
        name: Install ripgrep
        if: inputs.ripgrep
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep)
      - &sandbox
        name: Prepare Docker sandbox image
        if: inputs.sandbox
        run: |
          if ! docker image inspect openclaw-sandbox:bookworm-slim >/dev/null 2>&1; then scripts/sandbox-setup.sh; fi
      - &browser
        name: Install Chromium
        if: inputs.browser
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - &build
        name: Build test runtime
        if: inputs.build != ''
        env:
          OPENCLAW_BUILD_PRIVATE_QA: ${{ inputs.build == 'private-qa' && '1' || '0' }}
          VITEST: "1"
          BUILD_MODE: ${{ inputs.build }}
        run: |
          if [[ "$BUILD_MODE" == full ]]; then pnpm build; else pnpm build qaRuntime; fi
          if [[ "$BUILD_MODE" == private-qa ]]; then echo "OPENCLAW_E2E_USE_PREBUILT_DIST=1" >> "$GITHUB_ENV"; fi
      - &ai-types
        name: Build AI package declarations
        if: inputs.build == 'private-qa' && inputs.config == 'test/vitest/vitest.e2e.config.ts'
        env:
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "0"
        run: node --import tsx scripts/tsdown-build.mts --config tsdown.ai.config.ts
      - &ddtest
        uses: ./.ci-harness/.github/actions/setup-ddtest
      - name: Plan with ddtest
        id: plan
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          MAX_RUNNERS: ${{ inputs.max-runners }}
        run: |
          ddtest plan \
            --min-parallelism 1 --max-parallelism "$MAX_RUNNERS" \
            --ci-job-overhead 64s --strict-discovery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ddtest-${{ inputs.suite }}
          path: .testoptimization
          include-hidden-files: true
          if-no-files-found: error

  test:
    needs: plan
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - *checkout
      - *runson
      - *harness
      - *selection
      - *node
      - *compat
      - *bun
      - *git
      - *go
      - *ripgrep
      - *sandbox
      - *browser
      - *build
      - *ai-types
      - *ddtest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ddtest-${{ inputs.suite }}
          path: .testoptimization
      - uses: DataDog/test-visibility-github-action@1abae93083b69778facd7ee11f89184306c999e6 # v3.2.0
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          service: openclaw-tests
          js-tracer-version: latest
      - name: Run ddtest assignment
        env:
          CI_NODE_INDEX: ${{ matrix.ci_node_index }}
        run: |
          # Retain the builtin-module compatibility hook already required by PR #2.
          export NODE_OPTIONS="$NODE_OPTIONS --import=$GITHUB_WORKSPACE/scripts/lib/datadog-test-register.mjs"
          ddtest run --ci-node "$CI_NODE_INDEX"
      - name: Upload browser evidence
        if: always() && inputs.browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ddtest-browser-${{ inputs.suite }}-${{ matrix.ci_node_index }}
          path: |
            .artifacts/control-ui-e2e/
            .artifacts/control-ui-e2e-timeouts/
          include-hidden-files: true
          if-no-files-found: ignore
